<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostSzn Fantasy</title>
    <meta
      name="description"
      content="Fantasy football for the NFL postseason: draft a roster, then watch players drop out as their real teams are eliminated."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PostSzn Fantasy" />
    <meta property="og:title" content="PostSzn Fantasy" />
    <meta
      property="og:description"
      content="Fantasy football for the NFL postseason: draft a roster, then watch players drop out as their real teams are eliminated."
    />
    <meta property="og:url" content="https://postsznfantasy.com/" />
    <meta property="og:image" content="https://postsznfantasy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PostSzn Fantasy" />
    <meta
      name="twitter:description"
      content="Fantasy football for the NFL postseason: draft a roster, then watch players drop out as their real teams are eliminated."
    />
    <meta name="twitter:image" content="https://postsznfantasy.com/og-image.png" />
    <meta name="theme-color" content="#121416" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Sets the saved theme before first paint so there is no dark flash. Keep in step with src/utils/themeMode.ts (index.test.ts checks). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("postszn-theme") !== "light") return;
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
          document.querySelector('link[rel="manifest"]').setAttribute("href", "/manifest-light.webmanifest");
        } catch (e) {}
      })();
    </script>
    <!-- Inline so first paint is not blocked on a stylesheet request (and the dark background never flashes white). -->
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
      }
      html, body {
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }

      /* MUI draws its own ring on buttons; this covers links and native controls. */
      :focus-visible {
        outline: 2px solid var(--ps-accent, #5cb8ff);
        outline-offset: 2px;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(900px 500px at 85% -10%, rgba(92, 184, 255, 0.06), transparent),
          radial-gradient(700px 400px at -10% 10%, rgba(92, 184, 255, 0.05), transparent), #121416;
        background-attachment: fixed;
      }
      :root[data-theme="light"] body {
        background:
          radial-gradient(900px 500px at 85% -10%, rgba(92, 184, 255, 0.12), transparent),
          radial-gradient(700px 400px at -10% 10%, rgba(92, 184, 255, 0.1), transparent), #ffffff;
        background-attachment: fixed;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
