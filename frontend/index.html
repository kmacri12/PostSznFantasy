<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostSznFantasy</title>
    <meta
      name="description"
      content="Fantasy football for the NFL postseason: draft a roster, then watch players drop out as their real teams are eliminated."
    />
    <meta name="theme-color" content="#121416" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Inline so first paint is not blocked on a stylesheet request (and the dark background never flashes white). -->
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
      }
      html, body {
        margin: 0;
        padding: 0;
      }
      :root {
        color-scheme: dark;
      }

      /* MUI draws its own ring on buttons; this covers links and native controls. */
      :focus-visible {
        outline: 2px solid #fbbf24;
        outline-offset: 2px;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(900px 500px at 85% -10%, rgba(92, 184, 255, 0.06), transparent),
          radial-gradient(700px 400px at -10% 10%, rgba(92, 184, 255, 0.05), transparent), #121416;
        background-attachment: fixed;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
