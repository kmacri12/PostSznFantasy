[project]
name = "postsznfantasy"
version = "0.1.0"
description = "Fantasy football platform for NFL postseason"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "firebase-admin>=6.7.0",
    "flask>=3.1.0",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=5.0.1",
    "flask-socketio>=5.5.1",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.2",
    "pyjwt>=2.10.1",
    "requests>=2.32.3",
    "requests-cache>=1.2.1",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "firebase_admin.*",
    "flask_bcrypt.*",
    "flask_cors.*",
    "flask_socketio.*",
    "requests_cache.*",
    "psycopg2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "routes.*",
    "utils.*",
    "app",
    "run",
    "api.routes.*",
    "api.utils.*",
    "api.app",
    "api.run",
]
ignore_errors = true
