[project]
name = "postsznfantasy"
version = "0.1.0"
description = "Fantasy football platform for NFL postseason"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10.1",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.34.0",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "requests_cache.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["..", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

