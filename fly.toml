# Fly.io config for the API. Runbook: docs/deploy/fly.md. Deploy only through the manual
# "Deploy API" workflow, and never during a live draft.
app = "postszn-api"

# Pick the Fly region closest to the Supabase project region (Supabase us-east-1 -> iad,
# eu-west-1 -> dub, ...). Changing it later means moving the machine, so decide with #105.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary machine from the NEW image before anything is replaced. A non-zero
  # exit aborts the deploy and the current machine keeps serving.
  release_command = "alembic -c api/alembic.ini upgrade head"

[env]
  # Non-secret settings only. Secrets (PG_URI, SUPABASE_URL, ...) come from `fly secrets`.
  ENVIRONMENT = "production"
  SEASON_YEAR = "2026"
  PORT = "8080"
  # uvicorn --proxy-headers only trusts 127.0.0.1 by default; Fly's proxy connects from elsewhere.
  FORWARDED_ALLOW_IPS = "*"
  DB_POOL_SIZE = "10"
  DB_MAX_OVERFLOW = "5"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always on: the draft clock and WebSocket rooms live in this process.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
