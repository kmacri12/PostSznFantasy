name: Deploy API

# Manual on purpose: no API deploys during a live draft (a restart drops every draft WebSocket).
on:
  workflow_dispatch:
    inputs:
      confirm_no_live_draft:
        description: "I checked: no draft is in the lobby, running or paused"
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Require the live-draft confirmation
        if: ${{ !inputs.confirm_no_live_draft }}
        run: |
          echo "::error::Tick 'I checked' after confirming there are no live drafts (docs/deploy/fly.md)."
          exit 1

      - uses: actions/checkout@v7

      # GitHub runners have no IPv6, so this uses the Supabase session pooler string.
      - name: Refuse to deploy while a draft is live
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: scripts/check-live-drafts.sh

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # --ha=false: the first deploy would otherwise create two machines, and two processes
      # means two draft clocks. Never use bluegreen for the same reason.
      - name: Deploy (release command runs alembic first)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --ha=false --strategy rolling
