name: CI Pipeline

on:
  push:
    branches: ["main", "master", "feat/*", "fix/*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy .

      - name: Run Pytest test suite
        run: uv run pytest

  frontend:
    name: Frontend Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check with Biome
        run: npx @biomejs/biome check src/

      - name: Build TypeScript & Vite bundle
        run: npm run build

      - name: Run Vitest test suite
        run: npm run test
