name: CI Pipeline

on:
  push:
    branches: ["main", "master", "feat/*", "fix/*"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Weekly, so new advisories surface even when nobody pushes.
    - cron: "0 9 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (make check-api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postszn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postszn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postszn_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: cd api && uv sync --frozen

      - name: Lint, type check and test
        run: make check-api

  frontend:
    name: Frontend (make check-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint, type check, test and build
        run: make check-web

  e2e:
    name: End-to-end (make e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postszn_e2e
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install backend dependencies
        run: cd api && uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright and Chromium
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Lint and type check the e2e project
        run: cd e2e && npx biome check . && npx tsc --noEmit

      - name: Run end-to-end tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Audit Python dependencies
        run: cd api && uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit npm dependencies
        run: cd frontend && npm audit --omit=dev
